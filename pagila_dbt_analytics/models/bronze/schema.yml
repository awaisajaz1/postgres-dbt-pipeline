version: 2

models:
  - name: raw_actors
    description: Raw actor data ingested from the Pagila source.

    config:
      contract:
        enforced: true

    columns:
      - name: actor_id
        description: Unique identifier for the actor.
        data_type: smallint
        constraints:
          - type: not_null

      - name: first_name
        description: Actor's first name.
        data_type: varchar

      - name: last_name
        description: Actor's last name.
        data_type: varchar

      - name: last_update
        description: Timestamp when the record was last updated.
        data_type: timestamp without time zone