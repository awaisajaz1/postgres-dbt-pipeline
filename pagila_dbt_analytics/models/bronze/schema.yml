      - name: category
        description: Source table containing category information.
      - name: city
        description: Source table containing city information.
      - name: country
        description: Source table containing country information.
      - name: customer
        description: Source table containing customer information.
      - name: film
        description: Source table containing film information.
        columns:
          - name: film_id
            description: '{{doc("film_id")}}'
          - name: title
            description: '{{doc("title")}}'
          - name: description
            description: '{{doc("description")}}'
          - name: release_year
            description: '{{doc("release_year")}}'
          - name: language_id
            description: '{{doc("language_id")}}'
          - name: original_language_id
            description: '{{doc("original_language_id")}}'
          - name: rental_duration
            description: '{{doc("rental_duration")}}'
          - name: rental_rate
            description: '{{doc("rental_rate")}}'
          - name: length
            description: '{{doc("length")}}'
          - name: replacement_cost
            description: '{{doc("replacement_cost")}}'
          - name: rating
