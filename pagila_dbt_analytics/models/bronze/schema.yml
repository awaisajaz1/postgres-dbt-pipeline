models:
  - name: bronze_actors
    description: Bronze table containing actor information.

    config:
      contract:
        enforced: true

    columns:
      - name: actor_id
        description: unique identifier for each actor
        data_type: smallint
        tests:
          - not_null
          - unique

      - name: first_name
        description: contains the first name of the actor
        data_type: varchar

      - name: last_name
        description: contains the last name of the actor
        data_type: varchar

      - name: last_update
        description: contains the last update timestamp for the actor
        data_type: timestamp without time zone
  

  - name: bronze_customer
    description: Bronze table containing customer information. 
    config:
      contract:
        enforced: true

    columns:
      - name: customer_id
        description: unique identifier for each customer
        data_type: integer
        tests:
          - not_null
          - unique

      - name: store_id
        description: contains the store identifier for the customer
        data_type: smallint

      - name: first_name
        description: contains the first name of the customer
        data_type: varchar

      - name: last_name
        description: contains the last name of the customer
        data_type: varchar

      - name: email
        description: contains the email address of the customer
        data_type: varchar

      - name: address_id
        description: contains the address identifier for the customer
        data_type: smallint

      - name: activebool
        description: contains the active status of the customer
        data_type: boolean

      - name: create_date
        description: contains the creation date for the customer
        data_type: date

      - name: last_update
        description: contains the last update timestamp for the customer
        data_type: timestamp without time zone

      - name: active
        description: contains the active status of the customer
        data_type: integer
  

  - name: bronze_film
    description: Bronze table containing film information. 
    config:
      contract:
        enforced: true

    columns:
      - name: film_id
        description: unique identifier for each film
        data_type: smallint
        tests:
          - not_null
          - unique

      - name: title
        description: contains the title of the film
        data_type: varchar

      - name: description
        description: contains the description of the film
        data_type: text

      - name: release_year
        description: contains the release year of the film
        data_type: integer

      - name: language_id
        description: contains the language identifier for the film
        data_type: smallint

      - name: original_language_id
        description: contains the original language identifier for the film
        data_type: smallint

      - name: rental_duration
        description: contains the rental duration for the film
        data_type: smallint

      - name: rental_rate
        description: contains the rental rate for the film
        data_type: numeric(4,2)

      - name: length
        description: contains the length of the film in minutes
        data_type: smallint

      - name: replacement_cost
        description: contains the replacement cost for the film
        data_type: numeric(5,2)

      - name: rating
        description: contains the rating of the film (e.g., G, PG, PG-13, R, NC-17)
        data_type: text

      - name: special_features
        description: contains any special features associated with the film (e.g., Trailers, Commentaries, Deleted Scenes, Behind the Scenes)
        data_type: text
      
      - name: fulltext
        description: contains the full-text search vector for the film
        data_type: tsvector
      
      - name: last_update
        description: contains the last update timestamp for the film
        data_type: timestamp without time zone